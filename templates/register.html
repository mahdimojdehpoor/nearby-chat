{% extends "base.html" %}
{% block title %}ثبت‌نام{% endblock %}
{% block content %}
<div class="card auth-card">
    <h1>ثبت‌نام</h1>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    <form method="post">
        <label>نام کاربری</label>
        <input type="text" name="username" required autofocus>
        <label>رمز عبور</label>
        <input type="password" name="password" required>
        <label>بیوگرافی کوتاه (اختیاری)</label>
        <input type="text" name="bio" placeholder="مثلاً: علاقه‌مند به فوتبال و فیلم">
        <label>هدف شما از عضویت</label>
        <select name="goal">
            {% for key, label in goals.items() %}
            <option value="{{ key }}">{{ label }}</option>
            {% endfor %}
        </select>
        <button type="submit">ساخت حساب</button>
    </form>
    <p class="muted">حساب داری؟ <a href="{{ url_for('login') }}">وارد شو</a></p>
</div>
{% endblock %}
